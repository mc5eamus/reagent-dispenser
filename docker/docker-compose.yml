version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: reagent-dispenser-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost
    networks:
      - reagent-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/plates"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: reagent-dispenser-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - reagent-network

networks:
  reagent-network:
    driver: bridge
